                <div className="min-h-screen pt-16 pb-12 px-4 fi"><div className="max-w-2xl mx-auto"><div className="flex items-center gap-3 mb-6"><button onClick={onBack} className="p-2 rounded-lg hover:bg-white/5 text-slate-400"><IconBack/></button><h1 className="text-base font-semibold text-white">{tt('forensic.title')}</h1></div><div className="w-full h-1.5 bg-white/5 rounded-full overflow-hidden mb-6"><div className="h-full bg-gradient-to-r from-indigo-500 to-purple-500 rounded-full transition-all" style={{width:((step+1)/scenarios.length*100)+'%'}}/></div><div className="bg-white/[.03] border border-white/5 rounded-xl p-6 mb-6"><p className="text-sm text-slate-300 mb-4">{scenarios[step].q}</p><div className="space-y-2">{scenarios[step].options.map((opt,i)=>(<button key={i} onClick={()=>handleAnswer(i)} className="w-full text-left p-3 rounded-lg bg-white/5 hover:bg-indigo-500/10 text-slate-300 hover:text-white text-sm transition-colors border border-white/5 hover:border-indigo-500/30">{opt}</button>))}</div></div><div className="flex justify-between text-xs text-slate-500"><span>{tt('forensic.answerLabel')}</span><span>{step+1}/{scenarios.length}</span></div></div></div>);
        }

        // ===== DASHBOARD =====
        function Dashboard({ blueprints, onView, onNew, onDelete }) {
            const { lang } = useLang();
            const tt = useT();
            const [search, setSearch] = useState('');
            const [sort, setSort] = useState(0);
            const filtered = blueprints.filter(bp => bp.name.toLowerCase().includes(search.toLowerCase()) || bp.domain
                .toLowerCase().includes(search.toLowerCase())).sort((a, b) => { if (sort === 0) return new Date(b
                    .date) - new Date(a.date); if (sort === 1) return b.score - a.score; return a.name.localeCompare(
                    b.name); });
            return (
                <div className="min-h-screen pt-16 pb-12 px-4 fi"><div className="max-w-6xl mx-auto"><div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6"><div><h1 className="text-2xl font-bold text-white">{tt('dashboard.title')}</h1><p className="text-sm text-slate-500">{blueprints.length} {tt('dashboard.sessions')}</p></div><button onClick={onNew} className="flex items-center gap-2 px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium"><span>+</span> {tt('dashboard.newSession')}</button></div><div className="flex flex-col sm:flex-row gap-3 mb-6"><div className="flex-1 relative"><input type="text" value={search} onChange={(e)=>setSearch(e.target.value)} placeholder={tt('dashboard.searchPlaceholder')} className="w-full px-4 py-2.5 rounded-xl bg-white/[.03] border border-white/5 text-white placeholder-slate-500 focus:outline-none focus:ring-1 focus:ring-indigo-500/50"/><svg className="absolute right-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg></div><select value={sort} onChange={(e)=>setSort(Number(e.target.value))} className="px-4 py-2.5 rounded-xl bg-white/[.03] border border-white/5 text-white text-sm focus:outline-none">{tt('dashboard.sortOptions').map((opt,i)=>(<option key={i} value={i}>{opt}</option>))}</select></div>{filtered.length===0?(<div className="text-center py-16"><div className="w-16 h-16 rounded-full bg-white/[.03] border border-white/5 flex items-center justify-center mx-auto mb-4"><svg className="w-8 h-8 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg></div><h3 className="text-lg font-semibold text-white mb-1">{tt('dashboard.noBlueprints')}</h3><p className="text-sm text-slate-500 mb-4">{tt('dashboard.noBlueprintsDesc')}</p><button onClick={onNew} className="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium">{tt('dashboard.createFirst')}</button></div>):(<div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">{filtered.map(bp=>(<div key={bp.id} className="bg-white/[.03] border border-white/5 rounded-xl p-4 hover:border-indigo-500/30 transition-colors"><div className="flex items-start justify-between mb-3"><div className="flex-1"><h3 className="text-sm font-semibold text-white mb-1 line-clamp-2">{bp.name}</h3><p className="text-xs text-slate-500">{bp.date}</p></div><span className={`text-xs px-2 py-1 rounded font-medium ${bp.score>=85?'bg-green-500/10 text-green-400':bp.score>=70?'bg-yellow-500/10 text-yellow-400':'bg-red-500/10 text-red-400'}`}>{bp.score}</span></div><div className="flex items-center gap-2 mb-3 text-xs text-slate-500"><span className="px-2 py-0.5 rounded bg-white/5">{tt('home.domains.'+bp.domain)||bp.domain}</span><span>{bp.entities} ent.</span><span>{bp.workflows} wf.</span></div><div className="flex items-center gap-2"><button onClick={()=>onView(bp)} className="flex-1 flex items-center justify-center gap-1 px-3 py-1.5 rounded-lg bg-white/5 hover:bg-indigo-500/10 text-slate-300 hover:text-indigo-300 text-xs transition-colors"><IconEye/> {tt('dashboard.view')}</button><button onClick={()=>onDelete(bp.id)} className="p-1.5 rounded-lg bg-white/5 hover:bg-red-500/10 text-slate-400 hover:text-red-400 transition-colors"><svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg></button></div></div>))}</div>)}</div></div>);
        }

        function Modal({ bp, onClose }) {
            const tt = useT();
            if (!bp) return null;
            return (
                <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 fi" onClick={onClose}><div className="bg-[#0f0f23] border border-white/10 rounded-2xl max-w-2xl w-full max-h-[80vh] overflow-auto" onClick={e=>e.stopPropagation()}><div className="p-6 border-b border-white/5"><div className="flex items-center justify-between"><div><h2 className="text-xl font-bold text-white">{bp.name}</h2><p className="text-sm text-slate-500">{bp.fingerprint}</p></div><button onClick={onClose} className="p-2 rounded-lg hover:bg-white/5 text-slate-400"><IconX/></button></div></div><div className="p-6"><div className="grid grid-cols-2 gap-4 mb-6"><div className="bg-white/[.03] border border-white/5 rounded-xl p-4 text-center"><div className="text-2xl font-bold text-indigo-300">{bp.score}</div><div className="text-xs text-slate-500 mt-1">{tt('modal.score')}</div></div><div className="bg-white/[.03] border border-white/5 rounded-xl p-4 text-center"><div className="text-2xl font-bold text-indigo-300">{bp.entities}</div><div className="text-xs text-slate-500 mt-1">{tt('modal.entities')}</div></div><div className="bg-white/[.03] border border-white/5 rounded-xl p-4 text-center"><div className="text-2xl font-bold text-indigo-300">{bp.workflows}</div><div className="text-xs text-slate-500 mt-1">{tt('modal.workflows')}</div></div><div className="bg-white/[.03] border border-white/5 rounded-xl p-4 text-center"><div className="text-2xl font-bold text-indigo-300">{bp.sessions}</div><div className="text-xs text-slate-500 mt-1">{tt('dashboard.sessions')}</div></div></div><div className="flex items-center gap-3"><button className="flex-1 flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium"><IconExport/> {tt('modal.exportLabel')}</button><button onClick={onClose} className="px-4 py-2.5 rounded-xl bg-white/5 hover:bg-white/10 text-slate-300 text-sm">{tt('dashboard.view')==='Ver'?'Cerrar':'Close'}</button></div></div></div></div>);
        }

        function Docs() {
            const tt = useT();
            return (
                <div className="min-h-screen pt-16 pb-12 px-4 fi"><div className="max-w-4xl mx-auto"><h1 className="text-2xl font-bold text-white mb-6">{tt('docs.title')}</h1><div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">{tt('docs.archCards',{returnObjects:true}).map((card,i)=>(<div key={i} className="bg-white/[.03] border border-white/5 rounded-xl p-4"><h3 className="text-sm font-semibold text-white mb-1">{card.n}</h3><p className="text-xs text-slate-400 mb-2">{card.t}</p><span className="text-[10px] px-2 py-0.5 rounded bg-green-500/10 text-green-400">{card.m}</span></div>))}</div><div className="bg-white/[.03] border border-white/5 rounded-xl p-4 mb-6"><h3 className="text-sm font-semibold text-white mb-3">API Endpoints</h3><div className="space-y-2">{tt('docs.apiEndpoints',{returnObjects:true}).map((ep,i)=>(<div key={i} className="flex items-center gap-3 text-xs font-mono"><span className={`px-2 py-1 rounded ${ep.m==='POST'?'bg-green-500/10 text-green-400':ep.m==='PUT'?'bg-blue-500/10 text-blue-400':'bg-slate-500/10 text-slate-400'}`}>{ep.m}</span><span className="text-slate-300">{ep.p}</span></div>))}</div></div><div className="bg-white/[.03] border border-white/5 rounded-xl p-4 mb-6"><h3 className="text-sm font-semibold text-white mb-3">Schema SQL</h3><pre className="text-xs text-slate-400 font-mono whitespace-pre overflow-x-auto">{tt('docs.schemaSQL')}</pre></div><div className="grid grid-cols-1 sm:grid-cols-2 gap-4">{tt('docs.securityCards',{returnObjects:true}).map((card,i)=>(<div key={i} className="bg-white/[.03] border border-white/5 rounded-xl p-4"><h3 className="text-sm font-semibold text-white mb-2">{card.t}</h3><ul className="space-y-1">{card.items.map((item,j)=>(<li key={j} className="text-xs text-slate-400 flex items-center gap-1.5"><span className="w-1 h-1 rounded-full bg-indigo-400"/>{item}</li>))}</ul></div>))}</div></div></div>);
        }

        // ===== APP PRINCIPAL =====
        function App() {
            const [lang, setLang] = useState('es');
            const tt = useT();
            const [page, setPage] = useState('home');
            const [session, setSession] = useState(null);
            const [extraction, setExtraction] = useState(null);
            const [blueprints, setBlueprints] = useState([
                { id: 'bp-1', name: 'Citas médicas', fingerprint: 'a3f2b1c4d5e6f7a8', date: '2026-05-01', score: 87,
                    domain: 'salud', sessions: 3, entities: 5, workflows: 2 },
                { id: 'bp-2', name: 'E-commerce premium', fingerprint: '8d7e6f5a4b3c2d1e', date: '2026-04-28',
                    score: 92, domain: 'ecommerce', sessions: 5, entities: 8, workflows: 3 },
                { id: 'bp-3', name: 'Plataforma educativa', fingerprint: 'c9b8a7d6e5f4g3h2', date: '2026-04-15',
                    score: 74, domain: 'educacion', sessions: 2, entities: 4, workflows: 1 },
            ]);
            const [modalBp, setModalBp] = useState(null);
            const [toasts, setToasts] = useState([]);

            const toast = (msg, type) => { const id = Date.now();
                setToasts(p => [...p, { id, msg, type }]);
                setTimeout(() => setToasts(p => p.filter(t => t.id !== id)), 3000); };
            const handleStart = (idea, mode, domain) => { setSession({ id: 's-' + Date.now(), mode, domain, idea });
                setExtraction(null);
                setPage(mode === 'forense' ? 'forensic' : 'extraction'); const modeLabel = mode === 'rapido' ? (lang ===
                    'es' ? 'Rápido' : 'Fast') : mode === 'forense' ? (lang === 'es' ? 'Forense' : 'Forensic') : (lang ===
                    'es' ? 'Estándar' : 'Standard');
                toast(tt('toast.sessionStarted') + modeLabel, 'success'); };
            const handleExtractionDone = (data) => { setExtraction(data);
                toast((data.entities?.length || 0) + tt('toast.entitiesDetected'), 'success');
                setPage('blueprint'); };
            const handleForensicDone = () => { setPage('extraction'); };
            const handleBlueprintDone = (compiledData) => {
                const data = compiledData || extraction || {};
                const safeEntities = Array.isArray(data.entities) ? data.entities : (Array.isArray(extraction?.entities) ?
                    extraction.entities : []);
                const safeCatalog = Array.isArray(data.catalog) ? data.catalog : (Array.isArray(data.workflows) ? data
                    .workflows : (Array.isArray(extraction?.catalog) ? extraction.catalog : []));
                const newBp = {
                    id: 'bp-' + Date.now(),
                    name: session?.idea?.substring(0, 35) || (lang === 'es' ? 'Nuevo Blueprint' : 'New Blueprint'),
                    fingerprint: Math.random().toString(36).substring(2, 10) + Math.random().toString(36).substring(2,
                        10),
                    date: new Date().toISOString().split('T')[0],
                    score: data.confidence || extraction?.confidence || 75,
                    domain: session?.domain || 'general',
                    sessions: 1,
                    entities: safeEntities.length || 0,
                    workflows: safeCatalog.length || 0
                };
                setBlueprints(p => [newBp, ...p]);
                setTimeout(() => { setSession(null);
                    setExtraction(null);
                    setPage('dashboard');
                    toast(tt('toast.blueprintCompiled'), 'success'); }, 100);
            };
            const handleDelete = (id) => { setBlueprints(p => p.filter(b => b.id !== id));
                toast(tt('toast.deleted')); };

            let content;
            if (page === 'home') content = <Home onStart={handleStart}/>;
            else if (page === 'extraction') content = <Extraction key={session?.id||'ext'} idea={session?.idea} domain={session?.domain} onComplete={handleExtractionDone} onBack={()=>{setPage('home');setSession(null);}}/>;
            else if (page === 'blueprint') content = <Blueprint extraction={extraction} session={session} onComplete={handleBlueprintDone} onBack={()=>setPage('extraction')}/>;
            else if (page === 'forensic') content = <Forensic key={session?.id||'forensic'} session={session} onComplete={handleForensicDone} onBack={()=>{setPage('home');setSession(null);}}/>;
            else if (page === 'dashboard') content = <Dashboard blueprints={blueprints} onView={setModalBp} onNew={()=>{setPage('home');setSession(null);}} onDelete={handleDelete}/>;
            else if (page === 'docs') content = <Docs/>;

            return (<LangContext.Provider value={{lang,setLang}}><div className="min-h-screen bg-[#0a0a1a]"><Nav page={page} setPage={setPage}/>{content}<Toasts items={toasts}/><Modal bp={modalBp} onClose={()=>setModalBp(null)}/></div></LangContext.Provider>);
        }

        try {
            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App />);
        } catch (err) {
            document.getElementById('root').innerHTML =
                '<div style="color:#ef4444;padding:40px;font-family:monospace;background:#0a0a1a;min-height:100vh"><h1>Error</h1><pre>' +
                err.message + '</pre><pre>' + err.stack + '</pre></div>';
            console.error(err);
        }
    </script>
</body>
</html>
